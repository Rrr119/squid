# Ten named user/domain ACLs covering exact, parent-domain, repeated,
# case-insensitive, wildcard, and append-style declarations.
auth_param basic program /dev/null
auth_schemes basic all
user_domain_cache_isolation on

acl user_domain_01 user_domain alice example.com
acl user_domain_02 user_domain bob .example.org
acl user_domain_03 user_domain carol docs.example.net dave api.example.net
acl user_domain_04 user_domain -i Erin Example.COM
acl user_domain_05 user_domain ANY public.example.com
acl user_domain_06 user_domain frank ANY
acl user_domain_07 user_domain grace example.com
acl user_domain_07 user_domain heidi example.org
acl user_domain_08 user_domain ivan one.example.com judy two.example.com
acl user_domain_09 user_domain mallory .internal.example
acl user_domain_10 user_domain niaj example.test

http_access allow user_domain_01
